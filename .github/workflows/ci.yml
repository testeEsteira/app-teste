name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: testeEsteira/reusable_workflows/.github/workflows/java-springboot.yml@main
    with:
      java-version: "21"
      ecr-registry: 854209350151.dkr.ecr.us-east-1.amazonaws.com
      aws-region: us-east-1
      ecr-repository: reusable_workflow
      platforms: linux/amd64,linux/arm64
    secrets: inherit